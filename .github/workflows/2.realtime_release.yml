name: Build realtime release

# 触发条件：手动触发或推送触发
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  build:
    name: Build
    runs-on: windows-latest
    env:
      PYTHONHASHSEED: 0
      SOURCE_DATE_EPOCH: 315532800
      MARCH7TH_LOG_LEVEL: DEBUG
      MARCH7TH_BROWSER_DOWNLOAD_USE_MIRROR: false
      PYTHONIOENCODING: utf-8

    steps:
      # 签出代码
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: "false"
          fetch-depth: 0

      # 检查版本文件是否被修改
      - name: Check if version.txt was changed
        id: check_version
        run: |
          $changedFiles = git diff HEAD~1 HEAD --name-only
          if ($changedFiles -match 'assets[/\\]config[/\\]version\.txt') {
            Write-Host "version.txt was changed in the latest commit, skipping the build"
            echo "should_build=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "version.txt was not changed, proceeding with the build"
            echo "should_build=true" >> $env:GITHUB_OUTPUT
          }

      # 设置 uv 和 Python 环境
      - name: Set up uv
        if: steps.check_version.outputs.should_build == 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.15"
          python-version: "3.14.5"
          enable-cache: true
          cache-python: true
          prune-cache: false

      # 安装依赖
      - name: Install dependencies
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          uv sync --group build
          uv run python build.py --task ocr

      # 并行生成程序
      - name: Generate program
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          $p2 = Start-Process -FilePath "uv" -ArgumentList 'run pyinstaller --distpath ".\dist" ".\March7thAssistant.spec" -y' -PassThru -NoNewWindow
          $p2.WaitForExit()
          if ($p2.ExitCode -ne 0) {
            Write-Host "Exit codes: Launcher=$($p2.ExitCode)"
            exit 1
          }

      # 移动资源到dist目录
      - name: Move assets to dist directory
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          Copy-Item -Path ".\assets\" -Destination ".\dist\March7thAssistant\assets\" -Recurse -Force
          Copy-Item -Path ".\README.md" -Destination ".\dist\March7thAssistant\" -Force

      # 创建压缩包（用 windows runner 预装的 7-Zip；-mx=1 快速压缩。
      # 先切到 dist 再打包目录本身，避免 dir/* 递归展开破坏结构）
      - name: Create archive
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          Rename-Item -Path .\dist\March7thAssistant -NewName March7thAssistant_${{ github.run_number }}
          Push-Location .\dist
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=1 -md=128m March7thAssistant_${{ github.run_number }}.7z March7thAssistant_${{ github.run_number }}
          Pop-Location
        shell: pwsh

      # 上传压缩包
      - name: Upload artifact
        if: steps.check_version.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: March7thAssistant_${{ github.run_number }}.7z
          path: ./dist/March7thAssistant_${{ github.run_number }}.7z
          compression-level: 0 # no compression
